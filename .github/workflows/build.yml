name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: Native tests (${{ matrix.os }}, ${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: make -j2 BUILD=${{ matrix.build }} all test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build WebAssembly site
        run: bash web/build.sh
      - name: Check output
        run: ls -l web/public/ascii-renderer.js web/public/ascii-renderer.wasm web/public/ascii-doom.js web/public/ascii-doom.wasm web/public/ascii-doom.data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Browser smoke test (runs every demo in headless Chromium)
        run: node web/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-site
          path: |
            web/public
            web/smoke.png
