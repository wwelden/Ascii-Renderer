name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug build (ASan/UBSan)
        run: make
      - name: Release build
        run: make clean && make BUILD=release

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build WebAssembly site
        run: bash web/build.sh
      - name: Check output
        run: ls -l web/public/ascii-renderer.js web/public/ascii-renderer.wasm web/public/ascii-doom.js web/public/ascii-doom.wasm web/public/ascii-doom.data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Browser smoke test (runs every demo in headless Chromium)
        run: node web/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-site
          path: |
            web/public
            web/smoke.png
